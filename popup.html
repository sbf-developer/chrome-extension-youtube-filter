<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed Sieve</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="rules.js"></script>
  <script defer src="popup.js"></script>
</head>
<body>
  <header>
    <h1>Feed Sieve</h1>
    <button type="button" id="toggle" disabled>Pause</button>
  </header>
  <form id="filters">
    <label for="block">What do you want to hide?</label>
    <textarea id="block" rows="4" placeholder="e.g. migration, politics, reaction videos" aria-describedby="hint" disabled></textarea>
    <p id="hint">Enter topics, phrases, or channel names separated by commas or new lines.</p>
    <footer>
      <p id="status" role="status"></p>
      <button type="submit" id="save" disabled>Save</button>
    </footer>
  </form>
</body>
</html>
